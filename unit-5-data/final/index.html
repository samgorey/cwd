                <!-- paragraph text - Source: https://www.w3schools.com/html/html_paragraphs.asp -->

                <!-- h2 section heading - Source: https://www.w3schools.com/html/html_headings.asp -->
                <h2>Have you ever been in a situationship?</h2>
                <p>chart 1.</p>

                <div class="chart-container">
                    <div class="flourish-embed flourish-chart" data-src="visualisation/28734588">

                        <noscript><img src="https://public.flourish.studio/visualisation/28734588/thumbnail" width="100%" alt="Bar chart showing daily Instagram usage hours among survey respondents" /></noscript>
                    </div>
                </div>

                <div class="divider"></div>

                <h2>Does Instagram make it easier to avoid defining a relationship?</h2>
                <p>chart description</p>

                <!-- Flourish Chart 3 embed - Source: https://help.flourish.studio/article/13-how-to-embed-a-visualisation -->
                <div class="chart-container">
                    <div class="flourish-embed flourish-chart" data-src="visualisation/28734614">

                        <noscript><img src="https://public.flourish.studio/visualisation/28734614/thumbnail" width="100%" alt="Donut chart showing responses to whether Instagram makes it easier to avoid defining a relationship" /></noscript>
