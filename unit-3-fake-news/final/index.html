<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
  	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- 
	The Goat's Post is a fake newspaper dedicated to LeBron James and his basketball
	Career. The site is entirely created to celeberate LeBron, "The Goat". The boostrap
	gives the paper a cool colum layout, while the black and cream give it a tradtional
	feel.:
	My Process:
    - Bootstrap 5 grid system: https://getbootstrap.com/docs/5.3/layout/grid/
    - Bootstrap 5 getting started: https://getbootstrap.com/docs/5.3/getting-started/introduction/
    - CSS styling: https://www.w3schools.com/css/
    - HTML images: https://www.w3schools.com/html/html_images.asp
    - CSS fonts: https://www.w3schools.com/css/css_font.asp
    - Images sourced from Wikimedia Commons under free license

	-->
	<title>The Goat's Post</title>
	
  	<!-- Bootstrap 5 CSS - Source: https://getbootstrap.com/docs/5.3/getting-started/introduction/ -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Page background and font - Source: https://www.w3schools.com/css/ */
        body {
            background-color: #F5F0E8;
            font-family: Georgia, serif;
        }

        /* Newspaper masthead - Source: https://www.w3schools.com/css/ */
        .masthead {
            background-color: #000000;
            color: #F5F0E8;
            text-align: center;
            padding: 20px;
            font-size: 60px;
        }

        /* Decorative gold divider - Source: https://www.w3schools.com/css/ */
        .gold-line {
            background-color: #C8A84B;
            height: 5px;
        }

        /* Newspaper date line - Source: https://www.w3schools.com/css/ */
        .dateline {
            text-align: center;
            font-size: 14px;
            padding: 8px;
            border-bottom: 1px solid #000000;
            border-top: 1px solid #000000;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 20px;
            font-weight: bold;
        }

        /* Image sizing - Source: https://www.w3schools.com/html/html_images.asp */
        img {
            width: 100%;
        }

        .story {
            padding: 15px;
            border-right: 1px solid #CCCCCC;
        }

        /* Bottom row stories - Source: https://www.w3schools.com/css/ */
        .bottom-row {
            border-top: 2px solid #000000;
            margin-top: 10px;
            padding-top: 10px;
        }
    </style>

</head>
